<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StatLab — Statistical Analysis for Students</title>
  <meta name="description" content="StatLab is a free, browser-based statistical analysis tool for undergraduate research. Upload a CSV or Excel file and run t-tests, ANOVA, correlation, chi-square, and regression without installing anything.">
  <meta name="theme-color" content="#0f1319">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f5bd0'/%3E%3Ctext x='50' y='72' font-size='62' font-family='Georgia,serif' fill='white' text-anchor='middle'%3E%CE%A3%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap">

  <link rel="stylesheet" href="css/style.css">

  <!-- Statistical and parsing libraries, loaded from CDN. Nothing is sent to a server. -->
  <script defer src="https://cdn.jsdelivr.net/npm/jstat@1.9.6/dist/jstat.min.js"></script>
  <script defer src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
  <script defer src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

  <script defer src="js/utils/stats.js"></script>
  <script defer src="js/utils/dom.js"></script>
  <script defer src="js/utils/charts.js"></script>
  <script defer src="js/state.js"></script>
  <script defer src="js/controllers/data.js"></script>
  <script defer src="js/controllers/descriptives.js"></script>
  <script defer src="js/controllers/frequencies.js"></script>
  <script defer src="js/controllers/ttest.js"></script>
  <script defer src="js/controllers/anova.js"></script>
  <script defer src="js/controllers/correlation.js"></script>
  <script defer src="js/controllers/chisquare.js"></script>
  <script defer src="js/controllers/regression.js"></script>
  <script defer src="js/controllers/export.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <a class="visually-hidden" href="#main">Skip to analysis</a>

  <div class="app">
    <aside class="sidebar">
      <div id="nav"></div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button id="menu-toggle" class="icon-btn menu-toggle" type="button" aria-label="Open navigation">☰</button>
        <div id="dataset-meta"></div>
        <div class="topbar-spacer"></div>
        <span id="result-count" class="topbar-count is-empty">No analyses yet</span>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch to light mode">☀</button>
      </header>

      <main id="main" class="main">
        <div class="main-inner">
          <div class="page-head">
            <h2 class="page-title">StatLab</h2>
            <p class="page-lede">Loading…</p>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
